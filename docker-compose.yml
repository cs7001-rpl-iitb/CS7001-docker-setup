services:
  ros2-tb3:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PARALLEL_JOBS: "2"
    image: ros2-humble-tb3:latest
    container_name: ros2-humble-tb3
    hostname: tb3

    ports:
      - "6080:6080"   # noVNC (browser)
      - "5901:5901"   # raw VNC (optional, for RealVNC/TigerVNC clients)

    environment:
      - VNC_RESOLUTION=1600x900
      - VNC_PASSWORD=turtlebot3
      - TURTLEBOT3_MODEL=burger
      - ROS_DOMAIN_ID=30
      - LIBGL_ALWAYS_SOFTWARE=1

    volumes:
      # your own packages / maps / bags land here and survive container rebuilds
      - ./workspace:/home/ros/ws

    shm_size: "2gb"
    restart: unless-stopped
    # No `command:` override — the image runs websockify in the foreground.
    # Get a shell with: docker exec -it ros2-humble-tb3 bash
